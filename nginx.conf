server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The site root is the platform overview, the same page platform-common
    # serves. API Manager's host root is a 200 page that sends the browser
    # to /api-manager/4.7.0/. Send this host root into the Cloud docs the
    # same way. The target is relative so it stays under the public prefix
    # the browser is already using.
    location = / {
        default_type text/html;
        return 200 "<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Redirecting...</title>\n    <link rel=\"canonical\" href=\"cloud/introduction/what-is-bijira/\">\n    <meta name=\"robots\" content=\"noindex\">\n    <script>var anchor=window.location.hash.substr(1);location.href=\"cloud/introduction/what-is-bijira/\"+(anchor?\"#\"+anchor:\"\")</script>\n    <meta http-equiv=\"refresh\" content=\"0; url=cloud/introduction/what-is-bijira/\">\n</head>\n<body>\nRedirecting...\n</body>\n</html>\n";
    }

    # /cloud/ is a directory with no index, so a bare request returns 403.
    # Continue from there to the same introduction page.
    location = /cloud {
        return 301 /cloud/;
    }

    location = /cloud/ {
        default_type text/html;
        return 200 "<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Redirecting...</title>\n    <link rel=\"canonical\" href=\"introduction/what-is-bijira/\">\n    <meta name=\"robots\" content=\"noindex\">\n    <script>var anchor=window.location.hash.substr(1);location.href=\"introduction/what-is-bijira/\"+(anchor?\"#\"+anchor:\"\")</script>\n    <meta http-equiv=\"refresh\" content=\"0; url=introduction/what-is-bijira/\">\n</head>\n<body>\nRedirecting...\n</body>\n</html>\n";
    }

    # Product-scoped search + breadcrumbs (no version router for Cloud).
    # Pages pin __md_scope to /cloud/, so Material asks for
    # /cloud/search/search_index.json and theme.js asks for
    # /cloud/assets/search-breadcrumbs.json. Serve the site-root copies
    # under those paths.
    location /cloud/search/ {
        alias /usr/share/nginx/html/search/;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /cloud/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "no-store" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
        # Fetched cross-origin by every other product+version deployment's
        # pages, to render this product's section in their sidebar.
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
