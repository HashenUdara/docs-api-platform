# Experimental version router for API Gateway.
#
# Purpose: let infra configure ONE routing rule for the whole product
# (/api-gateway -> this deployment's URL) instead of one rule per version.
# Every version's real backend is proxied here, invisibly - the reader's
# address bar never sees the raw choreoapps.dev address, and adding a new
# version later only means editing this one file and redeploying this one
# component, not touching infra's gateway again.
#
# This is purely additive: it does not modify or replace any existing
# per-version deployment. Each location below still points at that
# version's own, already-live Choreo URL.
#
# Same design as router_api-manager - see that branch for the fuller
# rationale on each piece (Referer-routing for assets/search, the
# no-store caching fix, SNI/Host handling).

# Assets (and search) carry no version in their own URL - each version's
# page references them as "../../assets/..." (relative to what that
# version's OWN standalone deployment thinks is its site root), which
# resolves to a bare /assets/... once proxied under /api-gateway/<version>/.
# There's no version segment left in that request to route on, so - same
# as this project's own docs for /search/ already anticipated - fall back
# to the Referer header (which version's page actually asked for this
# asset) to pick the right backend.
map $http_referer $api_gateway_asset_backend {
    default                     "https://e7d9f3fd-5ce8-479a-a1a8-2096a79d2a40.e1-us-east-azure.choreoapps.dev";
    "~*/api-gateway/1\.2\.0/"  "https://e7d9f3fd-5ce8-479a-a1a8-2096a79d2a40.e1-us-east-azure.choreoapps.dev";
    "~*/api-gateway/1\.1\.0/"  "https://e752eeef-9ca7-4802-93a2-cbcd49b339f1.e1-us-east-azure.choreoapps.dev";
    "~*/api-gateway/1\.0\.0/"  "https://19bb36e9-2dee-40b3-b8af-fce663e524ea.e1-us-east-azure.choreoapps.dev";
    "~*/api-gateway/next/"     "https://83f98214-b906-4935-9e34-81776c7f75ab.e1-us-east-azure.choreoapps.dev";
}

server {
    # A variable-based proxy_pass target (used below for assets/search) is
    # resolved at request time, not once at startup - needs an explicit
    # resolver to do that DNS lookup.
    resolver 8.8.8.8 valid=300s;

    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems) -
    # proxying (unlike docs-shared's plain static serving) makes nginx
    # actually use proxy_temp_path to buffer upstream responses.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Each backend is itself a Choreo app almost certainly fronted by a
    # shared gateway that routes by SNI/Host - both must reflect the real
    # backend's own hostname, not this router's, or the backend's own
    # ingress may reject/misroute the request.
    proxy_ssl_server_name on;

    # A version requested without its trailing slash must land on the slash
    # form before proxying, same as mkdocs' own use_directory_urls behavior -
    # otherwise relative asset/page links on the proxied page would resolve
    # one level too shallow. Matches a dotted version (1.2.0) or "next".
    location ~ ^/api-gateway/([\d.]+|next)$ {
        return 301 $scheme://$host/api-gateway/$1/;
    }

    # No version given at all - send the reader to the current default,
    # same as clicking the product from a bare site root would. Exact
    # match (=), not a prefix, so this can only ever match these two
    # literal paths - it can't shadow /api-gateway/1.2.0/ or any
    # other real version path. Update this alongside
    # versioned_sections.default in the default branch's own mkdocs.yml
    # whenever the default changes.
    location = /api-gateway {
        return 301 $scheme://$host/api-gateway/1.2.0/;
    }
    location = /api-gateway/ {
        return 301 $scheme://$host/api-gateway/1.2.0/;
    }

    # The default version's manifest - root-index.json points every
    # product's manifestUrl at this exact bare path (no version segment).
    # Update this whenever the configured default version changes.
    location = /api-gateway/product-nav-manifest.json {
        add_header Cache-Control "no-store" always;
        proxy_pass https://e7d9f3fd-5ce8-479a-a1a8-2096a79d2a40.e1-us-east-azure.choreoapps.dev/api-gateway/product-nav-manifest.json;
        proxy_set_header Host $proxy_host;
    }

    # Version-pinned search indexes and breadcrumb maps. Material loads
    # /api-gateway/<version>/search/search_index.json when __md_scope is the
    # version root. Path-based (not Referer): the search worker's Referer is
    # the worker script under /api-gateway/assets/, which would always select
    # the default backend if we used the shared /api-gateway/search/ route.
    location /api-gateway/1.2.0/search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://e7d9f3fd-5ce8-479a-a1a8-2096a79d2a40.e1-us-east-azure.choreoapps.dev/search/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/1.2.0/assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://e7d9f3fd-5ce8-479a-a1a8-2096a79d2a40.e1-us-east-azure.choreoapps.dev/assets/;
        proxy_set_header Host $proxy_host;
    }


    location /api-gateway/1.1.0/search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://e752eeef-9ca7-4802-93a2-cbcd49b339f1.e1-us-east-azure.choreoapps.dev/search/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/1.1.0/assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://e752eeef-9ca7-4802-93a2-cbcd49b339f1.e1-us-east-azure.choreoapps.dev/assets/;
        proxy_set_header Host $proxy_host;
    }


    location /api-gateway/1.0.0/search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://19bb36e9-2dee-40b3-b8af-fce663e524ea.e1-us-east-azure.choreoapps.dev/search/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/1.0.0/assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://19bb36e9-2dee-40b3-b8af-fce663e524ea.e1-us-east-azure.choreoapps.dev/assets/;
        proxy_set_header Host $proxy_host;
    }


    location /api-gateway/next/search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://83f98214-b906-4935-9e34-81776c7f75ab.e1-us-east-azure.choreoapps.dev/search/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/next/assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://83f98214-b906-4935-9e34-81776c7f75ab.e1-us-east-azure.choreoapps.dev/assets/;
        proxy_set_header Host $proxy_host;
    }


    location /api-gateway/1.2.0/ {
        proxy_pass https://e7d9f3fd-5ce8-479a-a1a8-2096a79d2a40.e1-us-east-azure.choreoapps.dev/api-gateway/1.2.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/1.1.0/ {
        proxy_pass https://e752eeef-9ca7-4802-93a2-cbcd49b339f1.e1-us-east-azure.choreoapps.dev/api-gateway/1.1.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/1.0.0/ {
        proxy_pass https://19bb36e9-2dee-40b3-b8af-fce663e524ea.e1-us-east-azure.choreoapps.dev/api-gateway/1.0.0/;
        proxy_set_header Host $proxy_host;
    }

    location /api-gateway/next/ {
        proxy_pass https://83f98214-b906-4935-9e34-81776c7f75ab.e1-us-east-azure.choreoapps.dev/api-gateway/next/;
        proxy_set_header Host $proxy_host;
    }

    # Referer-routed - see the map above. Both paths are IDENTICAL across
    # every version (no version segment in the URL itself), so nothing
    # about the request distinguishes one version's copy from another's
    # except the Referer header - which browsers do NOT consider part of
    # the cache key. Without disabling caching here, the first version
    # fetched "wins" the browser's cache for this URL and every other
    # version silently gets served that same stale response afterward.
    # search content genuinely differs per version and isn't filename-
    # hashed, so this is a real correctness bug, not just a performance
    # concern (see router_api-manager's history for how this was found).
    location /assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $api_gateway_asset_backend$request_uri;
        proxy_set_header Host $proxy_host;
    }

    location /search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $api_gateway_asset_backend$request_uri;
        proxy_set_header Host $proxy_host;
    }


    # Rebuilt pages reference /api-gateway/assets/ and /api-gateway/search/
    # (two levels up from /api-gateway/<version>/<page>/ instead of three).
    # Same Referer-routing and no-store caching as /assets/ and /search/
    # above; the /api-gateway prefix is stripped so the backend receives
    # the plain /assets/... or /search/... path it already serves.
    location ~ ^/api-gateway(/assets/.*)$ {
        add_header Cache-Control "no-store" always;
        proxy_pass $api_gateway_asset_backend$1$is_args$args;
        proxy_set_header Host $proxy_host;
    }

    location ~ ^/api-gateway(/search/.*)$ {
        add_header Cache-Control "no-store" always;
        proxy_pass $api_gateway_asset_backend$1$is_args$args;
        proxy_set_header Host $proxy_host;
    }

}
