# Experimental version router for API Manager.
#
# Purpose: let infra configure ONE routing rule for the whole product
# (/api-manager -> this deployment's URL) instead of one rule per version.
# Every version's real backend is proxied here, invisibly - the reader's
# address bar never sees the raw choreoapps.dev address, and adding a new
# version later only means editing this one file and redeploying this one
# component, not touching infra's gateway again.
#
# This is purely additive: it does not modify or replace any existing
# per-version deployment. Each location below still points at that
# version's own, already-live Choreo URL.

# Assets (and search) carry no version in their own URL - each version's
# page references them as "../../assets/..." (relative to what that
# version's OWN standalone deployment thinks is its site root), which
# resolves to a bare /assets/... once proxied under /api-manager/<version>/.
# There's no version segment left in that request to route on, so - same
# as this project's own docs for /search/ already anticipated - fall back
# to the Referer header (which version's page actually asked for this
# asset) to pick the right backend.
map $http_referer $apim_asset_backend {
    default                     "https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.7\.0/"   "https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.6\.0/"   "https://af9e99fc-6a88-4960-a69e-5ffdcd457040.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.5\.0/"   "https://9601dab6-b5d5-4c76-844a-23adabf456ce.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.4\.0/"   "https://016ec2d5-7731-44af-aa60-0c153c692bb7.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.3\.0/"   "https://8703ad4a-5a8b-46d4-abe6-764a9b745629.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.2\.0/"   "https://179f5897-d961-4752-a93c-ead747f8ec6b.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.1\.0/"   "https://376aace9-3c95-48d9-9e51-280a6b8c7dbd.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/4\.0\.0/"   "https://a9682a1d-fb4b-4768-9413-cce407b478c3.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/3\.2\.0/"   "https://96bc6fb8-b05b-40a7-a0b2-65ccd80a64c3.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/3\.1\.0/"   "https://4f2660ec-ab45-424e-afcb-35186e853555.e1-us-east-azure.choreoapps.dev";
    "~*/api-manager/3\.0\.0/"   "https://8540e59c-40d5-4309-8473-4163804cfa88.e1-us-east-azure.choreoapps.dev";
}

server {
    # A variable-based proxy_pass target (used below for assets/search) is
    # resolved at request time, not once at startup - needs an explicit
    # resolver to do that DNS lookup.
    resolver 8.8.8.8 valid=300s;

    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems) -
    # proxying (unlike docs-shared's plain static serving) makes nginx
    # actually use proxy_temp_path to buffer upstream responses.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Each backend is itself a Choreo app almost certainly fronted by a
    # shared gateway that routes by SNI/Host - both must reflect the real
    # backend's own hostname, not this router's, or the backend's own
    # ingress may reject/misroute the request.
    proxy_ssl_server_name on;

    # A version requested without its trailing slash (e.g. /api-manager/4.7.0)
    # must land on the slash form before proxying, same as mkdocs' own
    # use_directory_urls behavior - otherwise relative asset/page links on
    # the proxied page would resolve one level too shallow.
    location ~ ^/api-manager/(\d+\.\d+\.\d+)$ {
        return 301 $scheme://$host/api-manager/$1/;
    }

    # No version given at all - send the reader to the current default,
    # same as clicking the product from a bare site root would. Exact
    # match (=), not a prefix, so this can only ever match these two
    # literal paths - it can't shadow /api-manager/4.7.0/ or any other
    # real version path. Update this alongside versioned_sections.default
    # in the default branch's own mkdocs.yml whenever the default changes.
    location = /api-manager {
        return 301 $scheme://$host/api-manager/4.7.0/;
    }
    location = /api-manager/ {
        return 301 $scheme://$host/api-manager/4.7.0/;
    }

    # The default version's manifest - root-index.json points every
    # product's manifestUrl at this exact bare path (no version segment).
    # Update this whenever the configured default version changes.
    #
    # This exact URL is fetched by every OTHER product's page too - if the
    # default deployment is later rebuilt with different content (as
    # happened here: a divider fix), a browser that already cached this
    # response keeps serving the stale copy indefinitely, since nothing
    # about the URL itself changed. Same bug class as /assets/ and
    # /search/ below - caught the hard way by testing this one live.
    location = /api-manager/product-nav-manifest.json {
        add_header Cache-Control "no-store" always;
        proxy_pass https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev/api-manager/product-nav-manifest.json;
        proxy_set_header Host $proxy_host;
    }


    # Version-pinned search indexes and breadcrumb maps. Material loads
    # /api-manager/<version>/search/search_index.json when __md_scope is the
    # version root. Path-based (not Referer): the search worker's Referer is
    # the worker script under /api-manager/assets/, which would always select
    # the default backend if we used the shared /api-manager/search/ route.

    location /api-manager/4.7.0/search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev/search/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.7.0/assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://0f2f65aa-8eb1-45c9-85b5-3ce198bd532a.e1-us-east-azure.choreoapps.dev/assets/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.6.0/search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass https://af9e99fc-6a88-4960-a69e-5ffdcd457040.e1-us-east-azure.choreoapps.dev/search/;
        proxy_set_header Host $proxy_host;
    }

    location /api-manager/4.6.0/assets/ {
