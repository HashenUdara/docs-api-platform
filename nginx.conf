        proxy_set_header Host $proxy_host;
    }

    # Referer-routed - see the map above. Both paths are IDENTICAL across
    # every version (no version segment in the URL itself), so nothing
    # about the request distinguishes 4.7.0's copy from 4.6.0's except the
    # Referer header - which browsers do NOT consider part of the cache
    # key. Without disabling caching here, the first version fetched
    # "wins" the browser's cache for this URL and every other version
    # silently gets served that same stale response afterward. search
    # content genuinely differs per version and isn't filename-hashed, so
    # this is a real correctness bug, not just a performance concern.
    location /assets/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $apim_asset_backend$request_uri;
        proxy_set_header Host $proxy_host;
    }

    location /search/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $apim_asset_backend$request_uri;
        proxy_set_header Host $proxy_host;
    }

    # Rebuilt pages reference /api-manager/assets/ and /api-manager/search/
    # (two levels up from /api-manager/<version>/<page>/ instead of three).
    # Same Referer-routing and no-store caching as /assets/ and /search/
    # above; the /api-manager prefix is stripped so the backend receives
    # the plain /assets/... or /search/... path it already serves.
    location ~ ^/api-manager(/assets/.*)$ {
        add_header Cache-Control "no-store" always;
        proxy_pass $apim_asset_backend$1$is_args$args;
        proxy_set_header Host $proxy_host;
    }

    location ~ ^/api-manager(/search/.*)$ {
        add_header Cache-Control "no-store" always;
        proxy_pass $apim_asset_backend$1$is_args$args;
        proxy_set_header Host $proxy_host;
    }

