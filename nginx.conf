server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Pages rebuilt with the corrected base path reference assets and search
    # as ../../assets/ and ../../search/ (resolving to /ai-gateway/assets/
    # and /ai-gateway/search/ from a page at /ai-gateway/<version>/<page>/).
    # In production the router handles these paths; in a local container run
    # this deployment serves them directly from its own built assets.
    location /ai-gateway/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /ai-gateway/search/ {
        alias /usr/share/nginx/html/search/;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
        # Fetched cross-origin by every other product+version deployment's
        # pages, to render this product's section in their sidebar.
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
