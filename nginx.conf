server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Combined search artifacts are written under /tmp (Choreo root FS is
    # read-only). Exact locations so they win over the static root below.
    location = /search/search_index.json {
        alias /tmp/docs-search/search_index.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location = /assets/search-breadcrumbs.json {
        alias /tmp/docs-search/search-breadcrumbs.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        # Every product+version deployment fetches root-index.json (and loads
        # theme.js) from this deployment's own origin - genuinely cross-origin
        # once each is its own Choreo deployment, so allow it here.
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
